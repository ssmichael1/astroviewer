name: Build & Release

# Builds packaged binaries for macOS (Apple Silicon), Windows (x64), and
# Linux (x64 + arm64) with every driver feature enabled, bundling the SVBony
# and ToupTek runtime libraries. Uploads a per-platform archive artifact on
# every push/PR, and attaches them to a GitHub Release when a `v*` tag is
# pushed.
#
# Requires these repository variables (Settings -> Secrets and variables ->
# Actions -> Variables) pointing at hosted vendor SDK zips:
#   SVB_SDK_URL_MACOS    - macOS SVBony SDK zip   (contains lib/arm64/...)
#   SVB_SDK_URL_WINDOWS  - Windows SVBony SDK zip (contains lib/x64/...)
#   SVB_SDK_URL_LINUX    - Linux SVBony SDK zip   (contains lib/x64 and lib/armv8/...)
#   TOUPCAM_SDK_URL      - ToupTek SDK zip, one archive for all platforms
#                          (contains inc/, mac/, win/x64, linux/x64,
#                          linux/arm64/glibc)
# And one for the Gaia star catalog bundled into every package (the app builds
# the plate-solver database from it on first run):
#   GAIA_MERGED          - direct URL to the gaia_merged.bin catalog (~17 MB)
# All downloads are cached; bump the matching *_CACHE_VERSION below to refresh.
#
# Note: Linux GUI binaries are not fully self-contained. They bundle libusb,
# but the target machine must already provide system libraries (OpenGL,
# X11/Wayland, GTK3).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 'all' enables every driver backend (svbony, toupcam, gev, indi) plus the
  # tetra3 plate solver — see [features] in Cargo.toml.
  FEATURES: "all"
  SDK_CACHE_VERSION: "v1"
  TOUPCAM_SDK_CACHE_VERSION: "v1"
  CATALOG_CACHE_VERSION: "v1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed for the release upload on tags
    env:
      # 'true' only when the signing secrets are configured; lets the macOS
      # job sign+notarize when available and otherwise build unsigned (so
      # forks / PRs without secrets still succeed).
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
          - name: windows
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
            libdir: x64
            touplibdir: linux/x64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            libdir: armv8
            touplibdir: linux/arm64/glibc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Cache SVBony SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ matrix.name }}-svbsdk-${{ env.SDK_CACHE_VERSION }}

      - name: Download SVBony SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SDK_URL: ${{ startsWith(matrix.name, 'windows') && vars.SVB_SDK_URL_WINDOWS || startsWith(matrix.name, 'linux') && vars.SVB_SDK_URL_LINUX || vars.SVB_SDK_URL_MACOS }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_URL:-}" ]; then
            echo "::error::Repository variable for the SVBony SDK URL is not set."
            echo "::error::Set SVB_SDK_URL_MACOS / SVB_SDK_URL_WINDOWS / SVB_SDK_URL_LINUX under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          PY=$(command -v python3 || command -v python)
          curl -fL "$SDK_URL" -o sdk.zip
          mkdir -p sdk
          "$PY" -c "import zipfile; zipfile.ZipFile('sdk.zip').extractall('sdk')"

      - name: Locate SDK root
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          LIBDIR=$(find sdk -type d -name lib | head -n1)
          if [ -z "$LIBDIR" ]; then
            echo "::error::Could not find a 'lib' directory inside the extracted SDK."
            exit 1
          fi
          ROOT=$(dirname "$LIBDIR")
          ABS=$("$PY" -c "import os,sys;print(os.path.abspath(sys.argv[1]))" "$ROOT")
          echo "SVBCAMERA_SDK_PATH=$ABS" >> "$GITHUB_ENV"
          echo "Using SVBCAMERA_SDK_PATH=$ABS"

      - name: Cache ToupTek SDK
        id: toupsdk-cache
        uses: actions/cache@v4
        with:
          path: toupsdk
          key: toupsdk-${{ env.TOUPCAM_SDK_CACHE_VERSION }}

      - name: Download ToupTek SDK
        if: steps.toupsdk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SDK_URL: ${{ vars.TOUPCAM_SDK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_URL:-}" ]; then
            echo "::error::Repository variable TOUPCAM_SDK_URL (ToupTek SDK zip) is not set."
            echo "::error::Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          PY=$(command -v python3 || command -v python)
          curl -fL "$SDK_URL" -o toupsdk.zip
          mkdir -p toupsdk
          "$PY" -c "import zipfile; zipfile.ZipFile('toupsdk.zip').extractall('toupsdk')"

      - name: Locate ToupTek SDK root
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          HDR=$(find toupsdk -type f -path '*/inc/toupcam.h' | head -n1)
          if [ -z "$HDR" ]; then
            echo "::error::Could not find inc/toupcam.h inside the extracted ToupTek SDK."
            exit 1
          fi
          ROOT=$(dirname "$(dirname "$HDR")")
          ABS=$("$PY" -c "import os,sys;print(os.path.abspath(sys.argv[1]))" "$ROOT")
          echo "TOUPCAM_SDK_PATH=$ABS" >> "$GITHUB_ENV"
          echo "Using TOUPCAM_SDK_PATH=$ABS"

      - name: Cache Gaia catalog
        id: catalog-cache
        uses: actions/cache@v4
        with:
          path: catalog
          key: ${{ matrix.name }}-catalog-${{ env.CATALOG_CACHE_VERSION }}

      - name: Download Gaia catalog
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CATALOG_URL: ${{ vars.GAIA_MERGED }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_URL:-}" ]; then
            echo "::error::Repository variable GAIA_MERGED (catalog download URL) is not set."
            exit 1
          fi
          mkdir -p catalog
          curl -fL "$CATALOG_URL" -o catalog/gaia_merged.bin

      - name: Build
        shell: bash
        run: cargo build --release --features "$FEATURES"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Viewer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp target/release/viewer "$APP/Contents/MacOS/viewer"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/AppIcon.icns "$APP/Contents/Resources/"
          cp "$SVBCAMERA_SDK_PATH/lib/arm64/libusb-1.0.0.dylib" "$APP/Contents/Frameworks/"
          cp "$TOUPCAM_SDK_PATH/mac/libtoupcam.dylib" "$APP/Contents/Frameworks/"
          cp catalog/gaia_merged.bin "$APP/Contents/Resources/"
          # Sanity-check that the only non-system dylib dependencies are the
          # bundled libusb and libtoupcam.
          otool -L "$APP/Contents/MacOS/viewer" || true

      - name: Import signing certificate (macOS)
        if: matrix.name == 'macos' && env.HAS_SIGNING == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Sign, notarize & staple (macOS)
        if: matrix.name == 'macos' && env.HAS_SIGNING == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          APP="dist/Viewer.app"
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Signing with: $IDENTITY"
          # Sign inner Mach-Os first (the bundled dylibs), then the app, all with
          # the hardened runtime + secure timestamp that notarization requires.
          for DYLIB in "$APP"/Contents/Frameworks/*.dylib; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$DYLIB"
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Notarize using an App Store Connect API key.
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Archive (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Viewer.app dist/viewer-macos.zip
          echo "ASSET=dist/viewer-macos.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/viewer-windows | Out-Null
          Copy-Item target/release/viewer.exe dist/viewer-windows/
          # Ship every DLL the SDKs provide (SVBCameraSDK.dll plus any libusb,
          # and the ToupTek toupcam.dll).
          Copy-Item "$env:SVBCAMERA_SDK_PATH/lib/x64/*.dll" dist/viewer-windows/
          Copy-Item "$env:TOUPCAM_SDK_PATH/win/x64/toupcam.dll" dist/viewer-windows/
          Copy-Item catalog/gaia_merged.bin dist/viewer-windows/
          Compress-Archive -Path dist/viewer-windows/* -DestinationPath dist/viewer-windows.zip -Force
          "ASSET=dist/viewer-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          OUT="viewer-${{ matrix.name }}"
          mkdir -p "dist/$OUT"
          cp target/release/viewer "dist/$OUT/viewer"
          # The SVBony SDK is statically linked; only libusb is dynamic. Copy
          # the versioned .so files + symlinks (-P preserves the symlinks) for
          # the build's architecture. The ToupTek SDK is a dynamic libtoupcam.so.
          # The `$ORIGIN` rpath makes them all resolve.
          cp -P "$SVBCAMERA_SDK_PATH/lib/${{ matrix.libdir }}"/libusb-1.0.so* "dist/$OUT/"
          cp "$TOUPCAM_SDK_PATH/${{ matrix.touplibdir }}/libtoupcam.so" "dist/$OUT/"
          cp catalog/gaia_merged.bin "dist/$OUT/"
          ldd "dist/$OUT/viewer" | grep -iE 'usb|toupcam' || true
          tar -czf "dist/$OUT.tar.gz" -C dist "$OUT"
          echo "ASSET=dist/$OUT.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.name }}
          path: ${{ env.ASSET }}
          # Bound per-push artifact accumulation in Actions storage. Tagged
          # release assets are attached separately below and are unaffected.
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
