name: Windows GigE build

# Convenience build: compiles a 64-bit Windows (x64) binary of the viewer with
# the GigE Vision (`gev`) feature and uploads it as a downloadable artifact, so
# it can be run on another Windows machine without installing a Rust toolchain.
#
# Unlike release.yml this needs NO secrets or repository variables: the `gev`
# build pulls in no vendor SDK (viva-gige is pure Rust) and no Gaia catalog
# (the plate solver / starsolve feature is not enabled), and produces a single
# self-contained viewer.exe with no extra runtime DLLs to bundle.
#
# Runs on every push to the working branch below and can also be triggered
# manually from the Actions tab (Run workflow). The build is split into named
# steps (diagnostics -> fetch -> build) so a failure is pinpointed by which
# step goes red, even without downloading the full log.

on:
  push:
    branches: [gev-win-build, gev-netfix]
  workflow_dispatch:

jobs:
  windows:
    name: windows-x64 (gev)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          rustc --version
          cargo --version
          rustup show

      - name: Fetch dependencies
        shell: bash
        run: |
          set -x
          if ! cargo fetch --verbose 2> fetch-err.txt; then
            echo "::group::cargo fetch stderr"
            cat fetch-err.txt
            echo "::endgroup::"
            # Surface each error line as an annotation (readable without admin).
            while IFS= read -r line; do
              echo "::error::FETCH: ${line}"
            done < <(grep -iE 'error|failed|unable|denied|could not|timed out|resolve|refused' fetch-err.txt | head -20)
            exit 1
          fi

      - name: Build
        shell: bash
        run: cargo build --release --features gev --verbose

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/viewer-windows-gev | Out-Null
          Copy-Item target/release/viewer.exe dist/viewer-windows-gev/
          Compress-Archive -Path dist/viewer-windows-gev/* `
            -DestinationPath dist/viewer-windows-gev.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-windows-gev
          path: dist/viewer-windows-gev.zip
          retention-days: 14

      # On failure, capture the build log as a downloadable artifact so the
      # error is retrievable without repo-admin log access.
      - name: Upload build log on failure
        if: failure()
        shell: bash
        run: |
          set -eux
          cargo build --release --features gev --verbose 2> build-error.log || true
      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build-error.log
          retention-days: 14
          if-no-files-found: ignore
