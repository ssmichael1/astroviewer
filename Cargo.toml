[package]
name = "viewer"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"
image = "0.25"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
chrono = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fitskit = "0.2"
rfd = "0.17.2"
svbony = { version = "0.1", features = ["image"], optional = true }
# ToupTek (toupcam) USB/GigE cameras and rebrands (Altair, Omegon, RisingCam, …).
toupcam = { version = "0.1.0", features = ["image"], optional = true }
tetra3 = { version = "0.12.0", features = [
    "image",
    "parallel",
], optional = true }
# tetra3 = { version = "0.7.2", features = ["image"], optional = true }

# INDI client support (streaming XML over TCP; BLOBs decoded via fitskit).
quick-xml = { version = "0.42", optional = true }
base64 = { version = "0.23", optional = true }

# GigE Vision support (pure-Rust transport + GenICam XML interpreter).
viva-gige = { version = "0.5", optional = true }
cameleon-genapi = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
bytes = { version = "1", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
socket2 = { version = "0.6", optional = true }

[features]
default = []
svbony = ["dep:svbony"]
toupcam = ["dep:toupcam"]
starsolve = ["dep:tetra3"]
gev = ["dep:viva-gige", "dep:cameleon-genapi", "dep:tokio", "dep:bytes", "dep:zip", "dep:socket2"]
indi = ["dep:quick-xml", "dep:base64"]
all = ["svbony", "toupcam", "starsolve", "gev", "indi"]

[[example]]
name = "extract_bench"
required-features = ["starsolve"]

[[example]]
name = "gev_spike"
required-features = ["gev"]

[[example]]
name = "gev_force_ip"
required-features = ["gev"]

[[example]]
name = "gev_stream"
required-features = ["gev"]

[[example]]
name = "gev_features"
required-features = ["gev"]

[[example]]
name = "gev_regs"
required-features = ["gev"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
